# PostgreSQL 15 配置文件 - 容器内优化版（1GB内存优化）
# 位置: /etc/postgresql/15/main/postgresql.conf

#------------------------------------------------------------------------------
# 连接和认证设置
#------------------------------------------------------------------------------
listen_addresses = 'localhost'          # 只监听本地连接
port = 5432                             # 默认端口
max_connections = 300                   # 最大连接数（调整到300，适配应用层100+连接并发）
superuser_reserved_connections = 3      # 保留给超级用户的连接（减少到3）

#------------------------------------------------------------------------------
# 内存设置（激进优化，大幅减少内存占用）
#------------------------------------------------------------------------------
shared_buffers = 64MB                   # 共享缓冲区（进一步减少到64MB，减少主进程内存）
work_mem = 4MB                          # 工作内存（减少到4MB，每个连接节省4MB）
maintenance_work_mem = 32MB             # 维护工作内存（减少到32MB，节省内存）
effective_cache_size = 128MB            # 有效缓存大小（减少到128MB，适合容器）
temp_buffers = 4MB                      # 临时缓冲区（减少到4MB，节省内存）

# 额外内存优化设置
max_stack_depth = 2MB                   # 减少栈深度限制，节省内存
hash_mem_multiplier = 1.0               # 减少哈希内存倍数（从2.0减少到1.0）

#------------------------------------------------------------------------------
# 写入设置（容器环境优化，减少内存和IO开销）
#------------------------------------------------------------------------------
wal_buffers = 4MB                       # WAL缓冲区（进一步减少到4MB，节省内存）
checkpoint_completion_target = 0.9      # 检查点完成目标（提高到0.9，平滑检查点，降低抖动）
wal_writer_delay = 200ms                # WAL写入延迟（增加到200ms，减少写入频率）
commit_delay = 10                       # 提交延迟（增加到10ms，减少提交频率）
commit_siblings = 3                     # 提交兄弟数（减少到3，适合容器环境）

#------------------------------------------------------------------------------
# 查询优化器设置（1GB内存优化，提高查询性能）
#------------------------------------------------------------------------------
random_page_cost = 1.0                  # 随机页面成本（SSD优化，保持1.0）
effective_io_concurrency = 100          # 有效IO并发（减少到100，适合小内存系统）
default_statistics_target = 100         # 默认统计目标（优化为100，适合小型数据库）
parallel_tuple_cost = 0.1               # 并行元组成本（保持0.1，优化并行查询）
parallel_setup_cost = 500.0             # 并行设置成本（减少到500.0，适合小内存系统）

#------------------------------------------------------------------------------
# 并行查询设置（容器环境优化，进一步减少并行开销）
#------------------------------------------------------------------------------
max_worker_processes = 2                # 最大工作进程数（减少到2，节省内存）
max_parallel_workers = 2                # 最大并行工作进程数（减少到2，节省内存）
max_parallel_workers_per_gather = 1     # 每个并行查询的最大工作进程数（减少到1，节省内存）
max_parallel_maintenance_workers = 1    # 最大并行维护工作进程数（减少到1，节省内存）
parallel_leader_participation = on      # 并行领导者参与（保持on，提高并行效率）

#------------------------------------------------------------------------------
# 日志设置
#------------------------------------------------------------------------------
log_destination = 'stderr'              # 日志输出到stderr（容器友好）
logging_collector = off                 # 关闭日志收集器
log_timezone = 'Asia/Shanghai'          # 日志时区设置为本地时区（CST UTC+8）
log_statement = 'none'                  # 不记录SQL语句
log_duration = off                      # 不记录执行时间
log_checkpoints = off                   # 不记录检查点
log_lock_waits = off                    # 不记录锁等待
log_temp_files = -1                     # 不记录临时文件

# --- 连接诊断（排查阶段可开启，稳定后可关闭） ---
log_connections = off                   # 关闭连接日志（减少日志量）
log_disconnections = off                # 关闭断开连接日志（减少日志量）
log_min_duration_statement = 30000     # 只记录超过30秒的慢查询

#------------------------------------------------------------------------------
# 性能设置（1GB内存优化，减少磁盘使用）
#------------------------------------------------------------------------------
synchronous_commit = on                 # 同步提交（保持on，确保数据安全）
fsync = on                              # 文件同步（保持on，确保数据安全）
full_page_writes = on                   # 完整页面写入（保持on，确保数据安全）
checkpoint_timeout = 10min              # 检查点超时（减少到10分钟，提高性能）
max_wal_size = 1GB                     # 最大WAL大小（减少到1GB，节省磁盘空间）
min_wal_size = 256MB                   # 最小WAL大小（减少到256MB，节省磁盘空间）
checkpoint_warning = 20s                # 检查点警告时间（减少到20秒，提高性能）

#------------------------------------------------------------------------------
# 复制设置（容器内不需要）
#------------------------------------------------------------------------------
wal_level = replica                     # WAL级别
max_wal_senders = 0                     # 最大WAL发送者
max_replication_slots = 0               # 最大复制槽

#------------------------------------------------------------------------------
# 统计设置
#------------------------------------------------------------------------------
track_activities = on                   # 跟踪活动
track_counts = on                       # 跟踪计数
track_io_timing = on                    # 跟踪IO时间（保持on，监控IO性能）
track_functions = none                  # 不跟踪函数
track_activity_query_size = 2048        # 活动查询大小（保持2048，支持长查询）

#------------------------------------------------------------------------------
# 自动清理设置（容器环境优化，减少维护开销）
#------------------------------------------------------------------------------
autovacuum = on                         # 启用自动清理（保持on，确保数据库健康）
autovacuum_max_workers = 1              # 最大自动清理工作进程（减少到1，节省内存）
autovacuum_naptime = 10min              # 自动清理间隔（增加到10分钟，减少检查频率）
autovacuum_vacuum_threshold = 500       # 清理阈值（增加到500，减少清理频率）
autovacuum_analyze_threshold = 500      # 分析阈值（增加到500，减少分析频率）
autovacuum_vacuum_scale_factor = 0.3    # 清理比例因子（增加到0.3，减少清理频率）
autovacuum_analyze_scale_factor = 0.2   # 分析比例因子（增加到0.2，减少分析频率）
autovacuum_vacuum_cost_limit = 500      # 清理成本限制（减少到500，控制清理速度）

#------------------------------------------------------------------------------
# 客户端连接设置
#------------------------------------------------------------------------------
default_transaction_isolation = 'read committed'  # 默认事务隔离级别
default_transaction_read_only = off     # 默认只读
default_transaction_deferrable = off    # 默认可延迟
timezone = 'Asia/Shanghai'             # 时区设置（PostgreSQL 15兼容）
timezone_abbreviations = 'Default'      # 时区缩写
dynamic_library_path = '$libdir'       # 动态库路径
local_preload_libraries = ''            # 本地预加载库
session_preload_libraries = ''          # 会话预加载库
shared_preload_libraries = 'pg_stat_statements,pg_buffercache'           # 共享预加载库（合并统一）

# --- 连接保活（与客户端 keepalive 对齐） ---
tcp_keepalives_idle = 20
tcp_keepalives_interval = 8
tcp_keepalives_count = 3

#------------------------------------------------------------------------------
# 锁管理设置（并发优化）
#------------------------------------------------------------------------------
deadlock_timeout = 1s                   # 死锁超时（保持1秒）
max_locks_per_transaction = 128         # 每个事务的最大锁数（保持128，支持复杂事务）
max_pred_locks_per_transaction = 128    # 每个事务的最大谓词锁数（保持128）
max_pred_locks_per_relation = -2        # 每个关系的最大谓词锁数（保持-2）
max_pred_locks_per_page = 4             # 每页的最大谓词锁数（保持4）

#------------------------------------------------------------------------------
# 版本兼容性设置
#------------------------------------------------------------------------------
array_nulls = on                        # 数组空值
backslash_quote = safe_encoding         # 反斜杠引号
default_with_oids = off                 # 默认OID
escape_string_warning = on              # 转义字符串警告
lo_compat_privileges = off              # 大对象兼容权限
quote_all_identifiers = off             # 引用所有标识符
standard_conforming_strings = on        # 标准符合字符串
transform_null_equals = off             # 转换空等于

#------------------------------------------------------------------------------
# 新增：批量操作优化设置
#------------------------------------------------------------------------------
# 连接池优化提示
# 注意：应用层连接池配置在 database_postgresql.py 中调整

#------------------------------------------------------------------------------
# 新增：内存使用监控和优化
#------------------------------------------------------------------------------
# 启用内存使用统计
# track_io_timing 已在上方开启，此处去重

# 新增：查询性能优化
#------------------------------------------------------------------------------
# 启用查询计划缓存
plan_cache_mode = auto                  # 自动查询计划缓存模式

# 优化排序操作（保持上方 work_mem=16MB，避免并发内存放大）

# --- 会话与事务超时（防长时间闲置/挂起） ---
# 重要：浏览器操作（如抖音、YouTube）可能需要较长时间，需要足够的超时值
# 统一设置为15分钟（900秒），与应用层用户级别设置保持一致
idle_session_timeout = 60min                   # 空闲会话超时60分钟
idle_in_transaction_session_timeout = 900000   # 事务空闲超时设置为15分钟（900秒），支持长时间同步操作

statement_timeout = 600s                        # 语句超时增加到10分钟，支持复杂查询和批量操作

# 优化哈希操作 (已在上方设置为1.0)
