[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
loglevel=warn
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgresql]
command=/bin/bash /app/postgresql/start_postgresql_daemon.sh
user=easyvdl
autostart=true
autorestart=true
startretries=5
startsecs=30
priority=1
stdout_logfile=/app/logs/postgresql.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=PGDATA="/app/database/PostgreSQL",
    PGDATABASE="postgres",
    PGUSER="postgres",
    PGHOST="localhost",
    LANG="en_US.UTF-8",
    LC_ALL="en_US.UTF-8",
    PATH="/usr/lib/postgresql/15/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:easy-vdl-unified-service]
command=bash -c ". /opt/venv/bin/activate && python -m uvicorn main:app --uds /app/sockets/easy-vdl.sock --log-config /app/supervisor/logging.json"
directory=/app
# 注意：主应用以 root 运行（为解决飞牛等 NAS 系统的浏览器显示权限问题）
# umask=000 确保新建文件权限最宽松，容器重启时会统一修复为 777/666（NAS 兼容模式）
user=root
umask=000
autostart=true
autorestart=true
startretries=3
priority=2
depends_on=postgresql
# 应用日志完全由 Python logging 管理，Supervisor 不捕获 stdout
stdout_logfile=/dev/null
redirect_stderr=true
environment=PYTHONPATH="/opt/venv/lib/python3.10/site-packages",
    VIRTUAL_ENV="/opt/venv",
    PATH="/opt/venv/bin:%(ENV_PATH)s",
    PYTHONUNBUFFERED="1",
    LOG_LEVEL="INFO",
    LOG_DIR="/app/logs",
    # LICENSE_LOG_FILE="/app/logs/license.log",
    ENABLE_DETAILED_LOGGING="0",
    X_LIKES_ORDER_DEBUG="0"
stopasgroup=true
killasgroup=true

[program:nginx]
command=nginx -g "daemon off;"
# 注意：Nginx 未指定 user，以 root 启动（Master 进程）
# 但 Worker 进程会自动降权到 easyvdl（通过 /etc/nginx/nginx.conf 中的 user easyvdl; 指令）
# 这是 Nginx 的标准安全机制：Master(root) 管理进程，Worker(easyvdl) 处理请求
autostart=true
autorestart=true
startretries=3
priority=3
depends_on=easy-vdl-unified-service
stdout_logfile=/app/logs/nginx-access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
stderr_logfile=/app/logs/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=1

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x1024x16 -ac +extension GLX +render -noreset
user=easyvdl
priority=4
autostart=true
autorestart=true
startretries=3
depends_on=postgresql
stdout_logfile=/dev/null
redirect_stderr=true

[program:fluxbox]
command=/bin/bash /app/supervisor/start_fluxbox.sh 99
user=easyvdl
priority=5
autostart=true
autorestart=true
startretries=3
depends_on=xvfb
stdout_logfile=/dev/null
redirect_stderr=true
environment=DISPLAY=:99

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -loop -noxdamage -repeat -nopw -norc -rfbport 5900 -listen 127.0.0.1 -xkb -noxrecord -noxfixes -noxdamage -clear_keys -env FD_PROG=/usr/bin/fluxbox -debug_xdamage -debug_wireframe -6 -no6 -noipv6
user=easyvdl
priority=6
autostart=true
autorestart=true
startretries=3
depends_on=fluxbox
stdout_logfile=/dev/null
redirect_stderr=true
environment=DISPLAY=:99

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
user=easyvdl
priority=6
autostart=true
autorestart=true
startretries=3
depends_on=x11vnc
# stdout_logfile=/app/logs/websockify.log
# stdout_logfile_maxbytes=5MB
# stdout_logfile_backups=0
stdout_logfile=/dev/null
redirect_stderr=true
environment=DISPLAY=:99 
