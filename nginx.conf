map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    
    # 输出到 stdout/stderr，由 Supervisor 管理日志轮转
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    
    # 允许上传大文件（备份文件可能较大）
    client_max_body_size 1024M;
    
    # 隐藏Nginx版本号 (安全加固)
    server_tokens off;
    
    # 全局超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
    # 缓冲区优化 - 减少临时文件写入
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # 前端静态文件
    location / {
        root /app/frontend/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 添加CORS头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
    }
    

    
    # 缩略图请求不记录日志（防止刷屏）
    location /api/gallery-thumbnail/ {
        access_log off;
        proxy_pass http://unix:/app/sockets/easy-vdl.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 请求不记录日志（心跳/重连太频繁）
    location /api/ws/ {
        access_log off;
        proxy_pass http://unix:/app/sockets/easy-vdl.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 长连接超时防止频繁断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # 视频流代理（单独关闭缓冲，避免大流量落盘导致全站阻塞）
    location = /api/video/stream {
        proxy_pass http://unix:/app/sockets/easy-vdl.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout 120s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }

    # 统一API代理
    location /api/ {
        proxy_pass http://unix:/app/sockets/easy-vdl.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 超时设置（备份导入可能需要较长时间）
        proxy_connect_timeout 120s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }

    # 背景图片特殊处理 - 禁用缓存
            location /api/background/image {
            proxy_pass http://unix:/app/sockets/easy-vdl.sock;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 检查是否有时间戳参数
            if ($args ~ "t=") {
                # 有时间戳参数时，禁用缓存
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # 没有时间戳参数时，允许缓存
            if ($args !~ "t=") {
                add_header Cache-Control "public, max-age=31536000";
            }
            
            # 超时设置
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    

    
    # 下载文件服务
    location /downloads/ {
        alias /app/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # 支持特殊字符文件名
        charset utf-8;
        
        # 添加CORS头，允许跨域访问
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        
        # 本地访问特殊处理 - 禁用混合内容检查
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        
        # 处理OPTIONS请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        # 视频文件支持 - 本地访问优化
        location ~* \.(mp4|webm|avi|mov|mkv|flv|wmv)$ {
            add_header Accept-Ranges bytes;
            add_header Content-Disposition "inline";
            add_header Content-Type "video/mp4";
            
            # 本地访问时禁用安全限制
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options SAMEORIGIN;
            
            # 允许本地HTTP访问
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;";
        }
        
        # 处理404错误
        error_page 404 = @not_found;
    }
    
    # noVNC WebSocket proxy
    location /websockify {
        # 避免 query token 出现在访问日志中
        access_log off;

        # 仅允许已登录UI会话访问：优先使用 query token，其次使用 Authorization 头
        set $vnc_auth_header $http_authorization;
        if ($arg_token != "") {
            set $vnc_auth_header "Bearer $arg_token";
        }

        auth_request /_auth_vnc;

        proxy_pass http://localhost:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
        proxy_buffering off;
    }

    # 内部鉴权子请求（JWT）
    location = /_auth_vnc {
        internal;
        proxy_pass http://unix:/app/sockets/easy-vdl.sock:/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $vnc_auth_header;
        proxy_set_header X-Original-URI $request_uri;
    }

    # noVNC static files
    location /novnc/ {
        # noVNC 页面路径含连接参数，关闭访问日志降低敏感信息落盘风险
        access_log off;
        alias /usr/share/novnc/;
        try_files $uri $uri/ =404;
        index vnc.html;
        add_header Cache-Control no-cache;
    }
    
    # 404处理
    location @not_found {
        return 404 "File not found";
    }
} 
